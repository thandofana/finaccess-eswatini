[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finaccess-eswatini"
version = "0.1.0"
description = "Explainable financial-inclusion and mobile-money analytics for Eswatini"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "joblib==1.5.3",
    "matplotlib==3.11.1",
    "ipykernel==7.3.0",
    "nbclient==0.11.0",
    "nbformat==5.11.0",
    "numpy==2.4.6",
    "pandas==3.0.5",
    "pdfplumber==0.11.10",
    "pypdf==6.15.0",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "shap==0.52.0",
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "uvicorn==0.52.1",
    "httpx2==2.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
